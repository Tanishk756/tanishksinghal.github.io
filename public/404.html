<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tanishk Singhal — Redirecting</title>
    <script type="text/javascript">
      // GitHub Pages SPA Single Page App redirect script
      // If hosted on GitHub Pages as a project repository (tanishksinghal.github.io), keep 1 path segment.
      // If hosted on a custom domain or root user site, keep 0 path segments.
      var l = window.location;
      var pathSegmentsToKeep = (l.hostname.endsWith('github.io') && l.pathname.split('/')[1] === 'tanishksinghal.github.io') ? 1 : 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
